apiVersion: batch/v1
kind: CronJob
metadata:
  name: uh-ingest-daily
  namespace: ultrahuman
spec:
  schedule: "0 7 * * *"
  timeZone: "Europe/Berlin"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ultrahuman-registry
          containers:
            - name: uh-ingest
              image: forgejo.eldamar.dev/akadmin/ultrahuman-ingest:949a58a
              args: ["daily"]
              env:
                - name: TZ
                  value: "Europe/Berlin"
                - name: LOG_LEVEL
                  value: "INFO"
                - name: PGHOST
                  value: "ultrahuman-database"
                - name: PGPORT
                  value: "5432"
                - name: PGDATABASE
                  value: "ultrahuman"
                - name: UH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: ultrahuman-api-token
                      key: token
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: ultrahuman.ultrahuman-database.credentials.postgresql.acid.zalan.do
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ultrahuman.ultrahuman-database.credentials.postgresql.acid.zalan.do
                      key: password
                - name: HA_CONFIG_REPO_URL
                  value: "https://forgejo.eldamar.dev/akadmin/ha-config.git"
                - name: HA_CONFIG_GIT_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: ultrahuman-ha-config-git
                      key: username
                - name: HA_CONFIG_GIT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: ultrahuman-ha-config-git
                      key: token
              resources:
                requests:
                  cpu: "50m"
                  memory: "128Mi"
                limits:
                  cpu: "200m"
                  memory: "256Mi"
