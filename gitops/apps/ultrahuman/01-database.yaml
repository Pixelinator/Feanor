apiVersion: "acid.zalan.do/v1"
kind: postgresql
metadata:
  name: ultrahuman-database
  namespace: ultrahuman
spec:
  teamId: "ultrahuman"

  volume:
    size: 5Gi

  numberOfInstances: 1

  users:
    ultrahuman: []

  databases:
    ultrahuman: ultrahuman

  postgresql:
    version: "15"

  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  patroni:
    initdb:
      encoding: "UTF8"
      locale: "en_US.UTF-8"
    pg_hba:
      - local all all trust
      - host all all 0.0.0.0/0 md5
