apiVersion: "acid.zalan.do/v1"
kind: postgresql
metadata:
  name: ultrahuman-database
  namespace: ultrahuman
spec:
  teamId: "ultrahuman"

  volume:
    size: 5Gi

  numberOfInstances: 1

  users:
    ultrahuman: []

  databases:
    ultrahuman: ultrahuman

  postgresql:
    version: "15"

  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  patroni:
    initdb:
      encoding: "UTF8"
      locale: "en_US.UTF-8"
    pg_hba:
      - local all all trust
      # Was 0.0.0.0/0 -- any pod cluster-wide could attempt password auth.
      # Scoped to k3s's default pod CIDR; the ultrahuman NetworkPolicy
      # (network-policy.yaml) is the primary control, this is defense in depth.
      - host all all 10.42.0.0/16 md5
