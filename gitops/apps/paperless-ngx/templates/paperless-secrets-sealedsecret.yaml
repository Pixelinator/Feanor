{{/*
The chart's own postgresql.auth.existingSecret and redis.auth.existingSecret
(values.yaml) both point at this SealedSecret. It doesn't exist in the repo
yet -- it was previously created out-of-band via kubectl, which meant this
namespace couldn't be reproduced from git alone, and the redis password sat
in values.yaml in plaintext ("paperless") instead.

Generate and seal it:

  kubectl create secret generic paperless-secrets \
    --namespace paperless-ngx \
    --from-literal=postgres-password="$(openssl rand -base64 32)" \
    --from-literal=redis-password="$(openssl rand -base64 32)" \
    --dry-run=client -o yaml \
    | kubeseal --format yaml \
    > gitops/apps/paperless-ngx/templates/paperless-secrets-sealedsecret.yaml

Replace this file with the generated output. If a paperless-secrets Secret
already exists in-cluster from the old out-of-band setup, reuse its current
postgres-password value instead of a fresh random one (rotating it requires
also updating postgres's own stored password, not just the k8s Secret).
*/}}
