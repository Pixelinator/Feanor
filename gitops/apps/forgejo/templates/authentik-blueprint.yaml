apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints-forgejo
  namespace: authentik
data:
  forgejo.yaml: |
    version: 1
    metadata:
      name: homelab-forgejo
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        identifiers:
          name: Provider for forgejo
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: forgejo
          client_secret: ***REMOVED-LEAKED-SECRET***
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          access_token_validity: hours=1
          refresh_token_validity: days=30
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-entitlements]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/ak-api]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: forgejo
        attrs:
          name: forgejo
          group: dev
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Provider for forgejo]]
          policy_engine_mode: any

      # Separate from the OAuth2 provider above (that one's Forgejo's own
      # "Sign in with Authentik" button). This one gates the Traefik ingress
      # itself via forward-auth, added after the CVE-2026-60004 incident so
      # anonymous scanners can't reach Forgejo's web UI at all. Git smart-HTTP
      # and the REST API are excluded (skip_path_regex below) since those
      # authenticate per-request via Forgejo's own tokens/Basic-Auth, not a
      # browser SSO redirect that a git client can't follow.
      #
      # NOTE: assigning this provider to the embedded outpost happens
      # centrally in authentik-blueprints-base (90-outposts.yaml), same as
      # esphome/home-assistant.
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: Provider for forgejo forward-auth
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          external_host: https://forgejo.eldamar.dev
          # Git smart-HTTP endpoints (with or without a literal .git suffix
          # on the repo path -- Forgejo accepts both) and the REST API.
          skip_path_regex: |-
            ^/[^/]+/[^/]+(\.git)?/info/refs$
            ^/[^/]+/[^/]+(\.git)?/git-upload-pack$
            ^/[^/]+/[^/]+(\.git)?/git-receive-pack$
            ^/api/.*

      - model: authentik_core.application
        state: present
        identifiers:
          slug: forgejo-forwardauth
        attrs:
          name: forgejo (forward-auth)
          group: dev
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, Provider for forgejo forward-auth]]
          policy_engine_mode: any
