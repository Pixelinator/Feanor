apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints-n8n
  namespace: authentik
data:
  # NOTE: provider/application only. The embedded-outpost assignment lives
  # centrally in authentik-blueprints-base (90-outposts.yaml) because
  # blueprints SET the outpost provider list -- per-app entries would
  # overwrite each other.
  n8n.yaml: |
    version: 1
    metadata:
      name: homelab-n8n
    entries:
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: Provider for n8n
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          external_host: https://n8n.eldamar.dev
          # Workflow webhooks and n8n's own REST API authenticate themselves;
          # they must bypass authentik or external triggers stop working.
          skip_path_regex: |-
            ^/webhook/.*
            ^/webhook-test/.*
            ^/rest/.*

      - model: authentik_core.application
        state: present
        identifiers:
          slug: n8n
        attrs:
          name: n8n
          group: home
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, Provider for n8n]]
          policy_engine_mode: any
