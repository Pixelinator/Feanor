forgejo-runner:
  global:
    image:
      registry:
      pullPolicy:

  replicaCount: 1

  image:
    registry: code.forgejo.org
    repository: forgejo/runner
    pullPolicy: IfNotPresent
    tag: ""

  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""

  runner:
    config:
      # Set create to true to let the chart handle registration
      create: true
      existingSecret: ""
      
      # Use existingInitSecret for the registration token
      existingInitSecret: forgejo-runner-token

      instance: https://forgejo.eldamar.dev
      name: k3s-runner
      token: ""  # Token comes from existingInitSecret
      
      file:
        log:
          level: "info"
          job_level: info
        runner:
          file: ".runner"
          capacity: 2
          envs: {}  # Removed test env vars
          env_file: .env
          timeout: 3h
          insecure: false
          fetch_timeout: 5s
          fetch_interval: 2s
          labels:
            - "ubuntu-latest:docker://catthehacker/ubuntu:act-22.04"
            - "ubuntu-22.04:docker://catthehacker/ubuntu:act-22.04"
            - "rust:docker://catthehacker/ubuntu:act-22.04"
            - "node:docker://node:20-bookworm"
            - "alpine:docker://alpine:latest"

        cache:
          enabled: true
          dir: ""
          host: ""
          port: 0
          external_server: ""

        container:
          network: ""
          enable_ipv6: false
          # ponytail: privileged + host docker.sock is root-equivalent access
          # to the node for any CI job. Accepted for now because Forgejo has
          # DISABLE_REGISTRATION: true (values.yaml, forgejo app) so only
          # accounts we created can push jobs here -- the arbitrary-untrusted-
          # job case is already closed off at that layer. Upgrade path if
          # that ever changes: swap to a rootless runner image or sysbox/
          # gVisor sandboxing instead of a shared docker.sock.
          privileged: true
          # Exposes the dind sidecar's own docker socket inside job
          # containers (Docker-outside-of-Docker), so `docker build`/`push`
          # steps work. Trust expansion: any job on this runner gets
          # docker-socket (root-equivalent) access to the shared daemon.
          options: "-v /var/run/docker.sock:/var/run/docker.sock"
          workdir_parent: ""
          valid_volumes:
            - '**'
          docker_host: ""
          force_pull: false

        host:
          workdir_parent: ""

  dind:
    image:
      registry: docker.io
      repository: library/docker
      pullPolicy: IfNotPresent
      tag: 29.0.2-dind
    resources: {}

  kubectl:
    image:
      registry: docker.io
      repository: alpine/kubectl
      pullPolicy: IfNotPresent
      tag: 1.34.2

  serviceAccount:
    create: true
    automount: true
    annotations: {}
    name: ""

  podAnnotations: {}
  podLabels: {}

  podSecurityContext:
    fsGroup: 1000

  securityContext:
    privileged: true

  resources: {}

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    behavior: {}
    targetCPUUtilizationPercentage: 80

  volumes: []
  volumeMounts: []

  nodeSelector: {}
  tolerations: []
  affinity: {}

  extraEnvVars: []

  priorityClassName: ""
